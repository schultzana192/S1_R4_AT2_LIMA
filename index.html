<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <header class="site-header">
        <a href="" class="header-logo"> TECH STORE </a>
        <nav class="nav-menu">
            <a href=""> Inicio </a>
            <a href=""> Produtos </a>
            <a href=""> Contatos </a>
        </nav>

        <div class="herader-actions">
            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-solid fa-circle-user"></i>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <p class="hero-badge"> CATÁLOGO 2026 </p>
            <h1>Tecnologia para o seu dia a dia </h1>
            <p class="hero-description"> Confira nossa seleção de produtos </p>
        </section>

       <section class="product-grid">

            <div class="product-card">
                <div class="product-image-wrapper">
                    <img src="./images/headset.png" alt="Headset Gamer">
                </div>

                <div class="informacoes">
                    <p class="product-category">ÁUDIO & COMUNICAÇÃO</p>
                    <h3>Headset Gamer</h3>
                    <p class="descricao">Áudio imersivo de alta fidelidade e microfone com cancelamento de ruído.</p>

                    <div class="product-price-wrapper">
                        <span>Preço à vista</span>
                        <p>R$ 199,90</p>
                    </div>

                    <button>Ver produto -></button>
                </div>
            </div>
    </main>
</body>
</html>
